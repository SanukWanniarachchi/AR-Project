<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#096b74">
  <meta name="description" content="Little Reef — an interactive miniature aquarium anchored to a Hiro marker.">
  <title>Little Reef — Aquarium AR</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="topbar"><div class="brand"><strong>Little Reef</strong><span>A pocket aquarium</span></div><a class="mode-link" id="mode-link" href="?preview=1">3D preview</a></header>
  <div id="status" class="status" data-state="loading" role="status" aria-live="polite">Loading Little Reef…</div>
  <main id="stage" aria-label="Interactive aquarium"><div class="loading">Preparing your little ocean…</div></main>
  <section class="hud" aria-label="Aquarium controls">
    <p id="help">Allow camera access and point at the Hiro marker. Tap the bubble or treasure chest.</p>
    <div class="actions"><button type="button" id="bubble-button">Change bubble colour</button><button type="button" id="chest-button">Grow / shrink chest</button><button type="button" id="pause-button" aria-pressed="false">Pause motion</button><a href="marker.html" target="_blank" rel="noopener">Hiro marker</a></div>
    <div id="notice" class="notice" aria-live="polite">Keep the whole marker visible in good light.</div>
  </section>
  <noscript>This aquarium needs JavaScript. Enable it, then reload this page.</noscript>
</body>
</html>
