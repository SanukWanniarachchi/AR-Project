<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fish model studio — Little Reef</title><style>body{margin:0;color:#123c42;background:#e3efeb;font-family:Verdana,sans-serif}header,footer{padding:16px 22px}h1{font-family:Georgia,serif;margin:0 0 8px}p{font-size:13px;line-height:1.6;margin:8px 0}button{padding:12px 18px;background:#096b74;color:white;border:0;border-radius:20px;font:inherit}#view{height:58vh;min-height:300px}canvas{display:block;width:100%;height:100%;touch-action:none}a{color:#096b74}#result{min-height:22px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script><script src="js/core.js"></script><script src="model-source/fish-builder.js"></script></head><body><header><h1>Fish model studio</h1><p>Drag to rotate the original procedural fish. Edit <code>model-source/fish-builder.js</code>, reload, then export the updated model.</p></header><main id="view" aria-label="Rotatable fish model"></main><footer><button type="button" id="export" disabled>Export fish.glb</button><p id="result" role="status">Preparing model…</p><p>After export, replace <code>models/fish.glb</code> with the downloaded file and test the aquarium preview. <a href="?unused=1" id="back">Open aquarium preview</a></p></footer>
<script type="module">
import * as THREE from 'three';import {GLTFExporter}from 'three/addons/exporters/GLTFExporter.js';
const view=document.getElementById('view'),result=document.getElementById('result');document.getElementById('back').href='./?preview=1';
try{const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.01,30),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;view.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xf8f6ec,0x38606a,2));const light=new THREE.DirectionalLight(0xfff5db,2);light.position.set(-2,4,3);scene.add(light);const model=LittleReef.createFishModel(THREE);scene.add(model.object);const mixer=new THREE.AnimationMixer(model.object);model.animations.forEach(c=>mixer.clipAction(c).play());let theta=.25,phi=1.3,drag=null;function position(){camera.position.set(2.5*Math.sin(phi)*Math.sin(theta),2.5*Math.cos(phi),2.5*Math.sin(phi)*Math.cos(theta));camera.lookAt(0,0,0);}position();renderer.domElement.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-drag[0])*.01;phi=Math.max(.3,Math.min(2.7,phi+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];position();});renderer.domElement.addEventListener('pointerup',()=>{drag=null;});new ResizeObserver(()=>{renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();}).observe(view);let prev=0;function frame(now){requestAnimationFrame(frame);mixer.update(Math.min((now-prev)/1000,.05));prev=now;renderer.render(scene,camera);}requestAnimationFrame(frame);result.textContent='Model ready. This is the editable source of models/fish.glb.';const button=document.getElementById('export');button.disabled=false;button.addEventListener('click',async()=>{button.disabled=true;try{const clean=LittleReef.createFishModel(THREE);clean.object.userData={creator:'AI-assisted group starter; original procedural fish',license:'CC0-1.0',source:'model-source/fish-builder.js'};const binary=await new GLTFExporter().parseAsync(clean.object,{binary:true,animations:clean.animations,maxTextureSize:512});const url=URL.createObjectURL(new Blob([binary],{type:'model/gltf-binary'}));const a=document.createElement('a');a.href=url;a.download='fish.glb';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);LittleReef.dispose(clean.object);result.textContent='Exported fish.glb. Copy it into the models folder and test your changes.';}catch(e){result.textContent='Export failed: '+e.message;}finally{button.disabled=false;}});}catch(e){result.textContent='Model studio could not load: '+e.message;}
</script></body></html>
